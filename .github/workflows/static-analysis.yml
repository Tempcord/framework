name: Static Analysis

on:
  pull_request:
  push:
    branches: [master]

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Install packages
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer analyse
